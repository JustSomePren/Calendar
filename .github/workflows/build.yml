name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Podpisový klíč ze secrets
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::Chybí secret SIGNING_KEY (viz README, Podpisový klíč)"
            exit 1
          fi
          echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/klic.p12"
          echo "SIGNING_KEY_FILE=$RUNNER_TEMP/klic.p12" >> "$GITHUB_ENV"
      - run: ./gradlew lintDebug testDebugUnitTest koverHtmlReportDebug assembleDebug
        env:
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: kalendar-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testy-a-pokryti
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/kover/htmlDebug/
